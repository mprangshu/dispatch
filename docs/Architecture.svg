<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#455a64"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#c2185b"/>
    </marker>
    <style>
      .box   { rx:8; ry:8; stroke-width:2; }
      .title { font-size:13px; font-weight:700; }
      .sub   { font-size:11px; fill:#37474f; }
      .lbl   { font-size:11px; fill:#455a64; }
      .band  { font-size:12px; font-weight:700; fill:#90a4ae; }
      .qflow { stroke:#455a64; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .iflow { stroke:#c2185b; stroke-width:2; stroke-dasharray:6 4; fill:none; marker-end:url(#arrowDash); }
    </style>
  </defs>

  <!-- Title -->
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#263238">Agent Recommender &amp; Q&amp;A Chatbot — Architecture</text>
  <text x="560" y="54" text-anchor="middle" font-size="12" fill="#607d8b">One module per responsibility; core in src/, decoupled from interfaces. No API key required (every LLM call has a grounded fallback).</text>

  <!-- ============ Band labels ============ -->
  <text x="30" y="96"  class="band">INTERFACES</text>
  <text x="30" y="196" class="band">ORCHESTRATION</text>
  <text x="30" y="282" class="band">INTENT</text>
  <text x="30" y="372" class="band">PATHS</text>
  <text x="30" y="492" class="band">RETRIEVAL</text>
  <text x="30" y="582" class="band">STORE / INDEX</text>
  <text x="30" y="712" class="band">VECTOR STORE</text>
  <text x="30" y="822" class="band">CATALOG (data)</text>

  <!-- ============ Interfaces ============ -->
  <g>
    <rect class="box" x="200" y="70" width="180" height="56" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="290" y="94"  text-anchor="middle" class="title">CLI</text>
    <text x="290" y="112" text-anchor="middle" class="sub">app.py — REPL + index</text>

    <rect class="box" x="450" y="70" width="180" height="56" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="540" y="94"  text-anchor="middle" class="title">HTTP API</text>
    <text x="540" y="112" text-anchor="middle" class="sub">api.py — FastAPI</text>

    <rect class="box" x="700" y="70" width="180" height="56" fill="#e3f2fd" stroke="#1976d2"/>
    <text x="790" y="92"  text-anchor="middle" class="title">Web UI</text>
    <text x="790" y="110" text-anchor="middle" class="sub">frontend/ — Streamlit</text>
    <text x="790" y="123" text-anchor="middle" class="lbl">(HTTP only → api.py)</text>
  </g>

  <!-- ============ Orchestration ============ -->
  <rect class="box" x="350" y="160" width="380" height="56" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="540" y="184" text-anchor="middle" class="title">chatbot.py — handle(message)</text>
  <text x="540" y="202" text-anchor="middle" class="sub">detect intent → route → format grounded reply</text>

  <!-- ============ Intent ============ -->
  <rect class="box" x="390" y="250" width="300" height="50" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="540" y="270" text-anchor="middle" class="title">router.py — detect_intent()</text>
  <text x="540" y="288" text-anchor="middle" class="sub">recommend · info · clarify  (deterministic)</text>

  <!-- ============ Paths ============ -->
  <rect class="box" x="230" y="340" width="280" height="78" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="370" y="364" text-anchor="middle" class="title">recommender.py</text>
  <text x="370" y="382" text-anchor="middle" class="sub">recommend(query)</text>
  <text x="370" y="400" text-anchor="middle" class="lbl">implied filters · shortlist logic</text>

  <rect class="box" x="570" y="340" width="280" height="78" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="710" y="364" text-anchor="middle" class="title">info.py</text>
  <text x="710" y="382" text-anchor="middle" class="sub">answer_question(query) — RAG</text>
  <text x="710" y="400" text-anchor="middle" class="lbl">grounding gate (no fabrication)</text>

  <!-- ============ Retrieval ============ -->
  <rect class="box" x="370" y="460" width="340" height="52" fill="#fff3e0" stroke="#f57c00"/>
  <text x="540" y="482" text-anchor="middle" class="title">retriever.py</text>
  <text x="540" y="500" text-anchor="middle" class="sub">search_agents · search_sections → list[Hit]</text>

  <!-- ============ Store / Index ============ -->
  <rect class="box" x="230" y="550" width="280" height="92" fill="#fff3e0" stroke="#f57c00"/>
  <text x="370" y="573" text-anchor="middle" class="title">store.py</text>
  <text x="370" y="591" text-anchor="middle" class="sub">cached Chroma client + embedding fn</text>
  <text x="370" y="607" text-anchor="middle" class="sub">+ collection handles (singletons)</text>
  <text x="370" y="627" text-anchor="middle" class="lbl">refresh_catalog_caches() ← invalidation</text>

  <rect class="box" x="570" y="550" width="280" height="92" fill="#fff3e0" stroke="#f57c00"/>
  <text x="710" y="573" text-anchor="middle" class="title">index.py</text>
  <text x="710" y="591" text-anchor="middle" class="sub">build_index()</text>
  <text x="710" y="609" text-anchor="middle" class="lbl">rebuild both collections,</text>
  <text x="710" y="625" text-anchor="middle" class="lbl">then refresh caches</text>

  <!-- ============ Vector store ============ -->
  <rect class="box" x="230" y="680" width="280" height="56" fill="#fce4ec" stroke="#c2185b"/>
  <text x="370" y="704" text-anchor="middle" class="title">agent_summaries</text>
  <text x="370" y="722" text-anchor="middle" class="sub">coarse · 1 / agent (recommend)</text>

  <rect class="box" x="570" y="680" width="280" height="56" fill="#fce4ec" stroke="#c2185b"/>
  <text x="710" y="704" text-anchor="middle" class="title">agent_sections</text>
  <text x="710" y="722" text-anchor="middle" class="sub">fine · 1 / section (RAG)</text>
  <text x="540" y="752" text-anchor="middle" class="lbl">ChromaDB — local persistent store (.chroma/)</text>

  <!-- ============ Catalog ============ -->
  <rect class="box" x="350" y="800" width="380" height="56" fill="#fff8e1" stroke="#ff8f00"/>
  <text x="540" y="824" text-anchor="middle" class="title">agents/*.md</text>
  <text x="540" y="842" text-anchor="middle" class="sub">YAML frontmatter + fixed ## sections → loader.py → Agent</text>

  <!-- watcher -->
  <rect class="box" x="350" y="895" width="380" height="46" fill="#f1f8e9" stroke="#689f38"/>
  <text x="540" y="914" text-anchor="middle" class="title">scripts/watch_agents.py</text>
  <text x="540" y="930" text-anchor="middle" class="sub">watches agents/ → auto re-index + cache refresh</text>

  <!-- ============ Side: LLM ============ -->
  <rect class="box" x="930" y="340" width="160" height="78" fill="#fffde7" stroke="#f9a825"/>
  <text x="1010" y="364" text-anchor="middle" class="title">llm.py</text>
  <text x="1010" y="382" text-anchor="middle" class="sub">Gemini (optional)</text>
  <text x="1010" y="400" text-anchor="middle" class="lbl">generate() / available()</text>

  <!-- ============ Side: cross-cutting ============ -->
  <rect class="box" x="20" y="340" width="150" height="170" fill="#eceff1" stroke="#546e7a"/>
  <text x="95" y="362" text-anchor="middle" class="title">cross-cutting</text>
  <rect class="box" x="35" y="376" width="120" height="56" fill="#ffffff" stroke="#546e7a"/>
  <text x="95" y="398" text-anchor="middle" class="sub" font-weight="700">config.py</text>
  <text x="95" y="416" text-anchor="middle" class="lbl">paths · models</text>
  <text x="95" y="428" text-anchor="middle" class="lbl">k · thresholds</text>
  <rect class="box" x="35" y="444" width="120" height="56" fill="#ffffff" stroke="#546e7a"/>
  <text x="95" y="466" text-anchor="middle" class="sub" font-weight="700">logger.py</text>
  <text x="95" y="484" text-anchor="middle" class="lbl">[STEP] console</text>
  <text x="95" y="496" text-anchor="middle" class="lbl">+ logs/ file</text>

  <!-- ============ Query-flow arrows (solid) ============ -->
  <path class="qflow" d="M290,126 L430,158"/>
  <path class="qflow" d="M540,126 L540,158"/>
  <path class="qflow" d="M790,126 L650,158"/>
  <path class="qflow" d="M540,216 L540,248"/>
  <path class="qflow" d="M470,300 L400,338"/>
  <path class="qflow" d="M610,300 L680,338"/>
  <path class="qflow" d="M370,418 L470,458"/>
  <path class="qflow" d="M710,418 L610,458"/>
  <path class="qflow" d="M470,512 L400,548"/>
  <path class="qflow" d="M610,512 L680,548"/>
  <path class="qflow" d="M370,642 L370,678"/>
  <path class="qflow" d="M710,642 L710,678"/>
  <!-- recommender/info use LLM for prose -->
  <path class="qflow" d="M850,379 L928,379"/>

  <!-- ============ Ingestion-flow arrows (dashed, pink) ============ -->
  <path class="iflow" d="M620,800 L700,644"/>
  <path class="iflow" d="M710,550 L710,538"/>
  <path class="iflow" d="M620,596 L512,596"/>
  <path class="iflow" d="M740,680 L740,644" transform="translate(-30,0)"/>
  <path class="iflow" d="M540,895 L540,858"/>
  <path class="iflow" d="M450,895 L620,644"/>

  <!-- ============ Legend ============ -->
  <rect class="box" x="900" y="470" width="200" height="92" fill="#ffffff" stroke="#b0bec5"/>
  <text x="912" y="490" font-size="12" font-weight="700" fill="#37474f">Legend</text>
  <line x1="912" y1="508" x2="952" y2="508" class="qflow"/>
  <text x="960" y="512" class="lbl">query / read path</text>
  <line x1="912" y1="532" x2="952" y2="532" class="iflow"/>
  <text x="960" y="536" class="lbl">ingestion / write</text>
  <text x="912" y="556" class="lbl">config.py &amp; logger.py span all layers</text>
</svg>
